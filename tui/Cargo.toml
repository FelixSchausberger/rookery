[package]
name = "rookery-tui"
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
description = "The Rookery board: tasks and their conversations"
license = "MIT"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
