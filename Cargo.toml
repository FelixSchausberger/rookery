[workspace]
resolver = "2"
members = ["core", "cli", "tui"]

[workspace.package]
version = "0.5.1"
edition = "2021"
rust-version = "1.89"
authors = ["Felix Schausberger"]
license = "MIT"
repository = "https://github.com/FelixSchausberger/rookery"
readme = "README.md"

[workspace.dependencies]
libc = "0.2"
regex = "1"
rayon = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
